name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-gate:
    name: Build Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --quiet .#site
      - run: nix flake check --no-eval-cache
  deploy:
    needs: build-gate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --quiet .#site
      - name: Assemble the app and docs with source and site manifests
        run: |
          mkdir -p site
          cp -R -L result/. site/
          chmod -R u+w site
          printf '%s\n' "$GITHUB_SHA" > site/COMMIT
          cd web
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > ../app-sha256
          cp ../app-sha256 ../site/SHA256SUMS
          cd ../site
          sha256sum COMMIT >> SHA256SUMS
          find . -type f ! -name SITE-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > ../site-sha256
          cp ../site-sha256 SITE-SHA256SUMS
      - name: Attest where these files came from
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            site/SHA256SUMS
            site/SITE-SHA256SUMS
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
